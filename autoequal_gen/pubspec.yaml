name: autoequal_gen
description: |
  Code generator which can simplify work with 'equatable'.
  It will generate 'List<Object?> props' private extensions for all annotated classes.
version: 0.9.5
homepage: https://github.com/mrgnhnt96/autoequal
issue_tracker: https://github.com/mrgnhnt96/autoequal/issues

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  analyzer: ">=11.0.0 <15.0.0"
  autoequal: ">=0.1.0 <1.0.0"
  build: ^4.0.0
  code_builder: ^4.8.0
  change_case: ^2.2.0
  dart_style: ">=3.0.0 <4.0.0"
  meta: ">=1.0.0 <2.0.0"
  source_gen: ^4.2.4
  path: ">=1.0.0 <2.0.0"
  source_span: ^1.10.0

dev_dependencies:
  build_runner: ^2.11.1
  build_test: ^3.5.4
  equatable: ^2.0.5
  generator_test: ^0.6.0
  lints: ^3.0.0
  test: ^1.24.9
